name: Nightly Regression

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "./ledger-fuzz[dev]"
      - run: pytest ledger-fuzz/tests
